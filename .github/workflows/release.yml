name: Release

# Builds the release on a pushed version tag and creates the GitHub release with
# the extension (.vsix) and the npm package (.tgz) attached. Publishing those
# files to the registries is the separate, manually started publish.yml.
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile && ./refresh_submodules

    - name: Check that the tag matches the package.json version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION=$(jq -r '.version' package.json)
        if [ "$VERSION" != "$TAG" ]; then
          echo "::error::tag $TAG does not match package.json version $VERSION"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Build the extension package (.vsix)
      run: bun run package

    - name: Build the npm package (.tgz)
      run: bun ./scripts/pack-cli.mjs

    - name: Take the release notes from CHANGELOG.md
      run: |
        awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "::error::CHANGELOG.md has no '## $VERSION' section"
          exit 1
        fi

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file release-notes.md \
          "omnetpp-vscode-$VERSION.vsix" "build/omnetpp-opp-tools-$VERSION.tgz"
