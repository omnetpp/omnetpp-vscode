name: Release

on:
  push:
    tags:
      - '*.*.*'  # Triggers the workflow when pushing a tag that matches the pattern, e.g., 1.0.0

permissions:
        contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install && ./refresh_submodules

    - name: Check that the tag matches the package.json version
      run: |
        VERSION=$(jq -r '.version' package.json)
        if [ "$VERSION" != "${{ github.ref_name }}" ]; then
          echo "::error::tag ${{ github.ref_name }} does not match package.json version $VERSION"
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build VS Code extension package
      run: bun run package

    - name: Create GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload VS Code extension package to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./omnetpp-vscode-${{ env.VERSION }}.vsix
        asset_name: omnetpp-vscode-${{ env.VERSION }}.vsix
        asset_content_type: application/vsix

    - name: Publish to Open VSX Registry
      uses: HaaLeo/publish-vscode-extension@v1
      with:
        pat: ${{ secrets.OPEN_VSX_TOKEN }}
        extensionFile: ./omnetpp-vscode-${{ env.VERSION }}.vsix

    - name: Publish to Visual Studio Marketplace
      uses: HaaLeo/publish-vscode-extension@v1
      with:
        pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        registryUrl: https://marketplace.visualstudio.com
        extensionFile: ./omnetpp-vscode-${{ env.VERSION }}.vsix

    - name: Publish the command-line tools to npm (@omnetpp/opp-tools)
      env:
        NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: bun ./scripts/pack-cli.mjs --publish
