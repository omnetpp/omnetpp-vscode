# Use a hoisted (npm-style flat) node_modules layout instead of Bun's default
# isolated layout. The build (copy-assets.mjs / esbuild) and the test/smoke
# scripts resolve the web-tree-sitter runtime wasm via the top-level
# `node_modules/web-tree-sitter` path, which only exists when dependencies are
# hoisted to the root node_modules.
[install]
linker = "hoisted"
